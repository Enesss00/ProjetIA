name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.5.0
          working-directory: server
      - name: test (race)
        run: go test -race ./...
      - name: fuzz (short)
        run: |
          go test ./internal/command/ -run xxx -fuzz FuzzParse -fuzztime 25s
          go test ./internal/server/ -run xxx -fuzz FuzzWSDecode -fuzztime 25s
      - name: determinism / seeded replay check
        run: go run ./cmd/ghostnet replay -seeds 1,2,42,1337,99999,123456 -runs 3

  web:
    name: web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: prettier
        run: npm run format:check
      - name: unit tests
        run: npm run test
      - name: build
        run: npm run build

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build server
        run: cd server && go build -o ghostnet ./cmd/ghostnet
      - name: install web deps
        run: cd web && npm ci
      - name: install Playwright browser
        run: cd web && npx playwright install --with-deps chromium
      - name: build client
        run: cd web && npm run build
      - name: run e2e
        run: cd web && npx playwright test e2e/game.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
